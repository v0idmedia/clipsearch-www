services:
  clipsearch-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipsearch-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      LEAD_EMAIL: ""
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
    volumes:
      - clipsearch-data:/var/www/html/storage

volumes:
  clipsearch-data:
